# Production reverse proxy — HTTPS only with TLS 1.3 (NFR-03). Plain HTTP is redirected.
server {
    listen 80;
    server_name api.aqarcom.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.aqarcom.app;

    ssl_certificate     /etc/letsencrypt/live/api.aqarcom.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aqarcom.app/privkey.pem;
    ssl_protocols TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;          # spec books up to 20 MB
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
